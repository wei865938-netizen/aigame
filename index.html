<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2926">
<title>AIGAME 游戏机</title>
<style>
:root{--lcd:#f7e7b2;--lcd-deep:#eed58f;--card:#fff8dd;--ink:#4a2c15;--ink-soft:#8a6a45;--accent:#f08a3c;--bezel:#2b2926}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bezel);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#phone{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
#screen{flex:1;background:var(--lcd);border:3px solid #17140f;border-radius:12px;box-shadow:inset 0 0 0 2px #7d6440,0 0 0 2px #3a3734,0 10px 30px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
.bar{padding:6px 12px;background:linear-gradient(#ffd77a,#f0b642);border-bottom:2px solid var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.12em;font-size:13px;text-align:center}
.menu{padding:16px 12px;display:flex;flex-direction:column;gap:12px;flex:1}
h1{margin:0;font-size:22px;letter-spacing:.04em}
.lead{margin:0 0 4px;color:var(--ink-soft);font-size:13px}
a.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 14px;background:var(--card);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);color:inherit;text-decoration:none}
a.item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
a.item .t{font-weight:700;font-size:17px;display:block}
a.item .s{display:block;color:var(--ink-soft);font-size:12px;margin-top:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
a.item .go{color:var(--accent);font-weight:700;font-size:20px;font-family:ui-monospace,Menlo,Consolas,monospace}
.foot{margin-top:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.1em;display:flex;justify-content:space-between;padding:4px 4px 0}
</style>
</head>
<body>
<div id="phone"><div id="screen">
  <div class="bar">游戏</div>
  <div class="menu">
    <h1>AIGAME 游戏机</h1>
    <p class="lead">点开就玩,不用安装。进度记在你手机的浏览器里。</p>
    <a class="item" href="sushi-sokoban/"><span><span class="t">寿司消消乐 · 推箱子</span><span class="s">复古像素 · 闯关计时 · 34 关推箱子</span></span><span class="go">▶</span></a>
    <p class="foot"><span>AIGAME</span><span>2026</span></p>
  </div>
</div></div>
</body>
</html>
